{{ define "main" }}
<div class="container">
<article>
  <div class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.tags }}
        ·
        {{- range . }}
        <a href="/tags/{{ . | urlize }}/" class="tag">{{ . }}</a>
        {{- end }}
      {{ end }}
    </p>
  </div>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
</div>

{{ end }}
